user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    upstream bookmark_backend {
        server bookmark-service:8080;
    }

    upstream portal_frontend {
        server bookmark-portal:3000;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;


        location /api/bookmark_service/swagger/ {
            proxy_pass http://bookmark_backend/swagger/;
        }

        location /api/bookmark_service/ {
            proxy_pass http://bookmark_backend/api/bookmark_service/;
        }

        location ~ ^/([a-zA-Z0-9]{7})$ {
            proxy_pass http://bookmark_backend/api/bookmark_service/v1/links/redirect/$1;
        }

        location ~ /\. {
            deny all;
        }

        location / {
            proxy_pass http://portal_frontend;
        }
    }
}